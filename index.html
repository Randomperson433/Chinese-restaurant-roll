<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Restaurant Roll</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #2a0505; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useRef } = React;

    const FIRST_WORDS = ["China","Golden","Jade","Lucky","Happy","Dragon","Panda","Lotus","Jasmine","Tiger","Yummy","Asia"];
    const LAST_WORDS  = ["Wok","Palace","House","Garden","Gourmet","Dumpling","Kitchen","Pavilion","Express","Buffet","Dynasty","Cafe"];

    const SPIN_INTERVAL  = 80;
    const SPIN_DURATION_1 = 1600;
    const SPIN_DURATION_2 = 2800;

    function App() {
      const [reel1, setReel1]     = useState("???");
      const [reel2, setReel2]     = useState("???");
      const [spinning, setSpinning] = useState(false);
      const [locked1, setLocked1] = useState(false);
      const [locked2, setLocked2] = useState(false);
      const [revealed, setRevealed] = useState(false);
      const [finalName, setFinalName] = useState(null);
      const [shake1, setShake1]   = useState(false);
      const [shake2, setShake2]   = useState(false);

      const intervalRef  = useRef(null);
      const interval2Ref = useRef(null);

      const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const spin = () => {
        if (spinning) return;
        setSpinning(true);
        setLocked1(false);
        setLocked2(false);
        setRevealed(false);
        setFinalName(null);
        setShake1(false);
        setShake2(false);

        const chosen1 = pickRandom(FIRST_WORDS);
        const chosen2 = pickRandom(LAST_WORDS);

        intervalRef.current = setInterval(() => setReel1(pickRandom(FIRST_WORDS)), SPIN_INTERVAL);

        const t2 = setTimeout(() => {
          interval2Ref.current = setInterval(() => setReel2(pickRandom(LAST_WORDS)), SPIN_INTERVAL);
        }, 300);

        setTimeout(() => {
          clearInterval(intervalRef.current);
          setReel1(chosen1);
          setLocked1(true);
          setShake1(true);
          setTimeout(() => setShake1(false), 400);
        }, SPIN_DURATION_1);

        setTimeout(() => {
          clearInterval(interval2Ref.current);
          setReel2(chosen2);
          setLocked2(true);
          setShake2(true);
          setTimeout(() => setShake2(false), 400);
          setTimeout(() => {
            setFinalName(`${chosen1} ${chosen2}`);
            setRevealed(true);
            setSpinning(false);
          }, 500);
        }, SPIN_DURATION_2);
      };

      return (
        <div style={{
          minHeight: "100vh",
          background: "#2a0505",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          fontFamily: "'Georgia', serif",
          padding: "24px",
          position: "relative",
          overflow: "hidden",
        }}>
          {["topleft","topright","bottomleft","bottomright"].map(pos => (
            <div key={pos} style={{
              position: "absolute",
              [pos.includes("top") ? "top" : "bottom"]: 20,
              [pos.includes("left") ? "left" : "right"]: 20,
              width: 48, height: 48,
              borderTop:    pos.includes("top")    ? "2px solid #c8972a" : "none",
              borderBottom: pos.includes("bottom") ? "2px solid #c8972a" : "none",
              borderLeft:   pos.includes("left")   ? "2px solid #c8972a" : "none",
              borderRight:  pos.includes("right")  ? "2px solid #c8972a" : "none",
              opacity: 0.6,
            }} />
          ))}

          <div style={{ textAlign: "center", marginBottom: 36 }}>
            <h1 style={{ margin: 0, fontSize: "clamp(28px,6vw,48px)", fontWeight: "bold", color: "#f5d87a", letterSpacing: "0.04em", lineHeight: 1.1 }}>
              Chinese Restaurant
            </h1>
            <h1 style={{ margin: 0, fontSize: "clamp(28px,6vw,48px)", fontWeight: "bold", color: "#e8352a", letterSpacing: "0.04em", lineHeight: 1.1 }}>
              Roll
            </h1>
          </div>

          <div style={{ display: "flex", gap: 12, marginBottom: 36, alignItems: "center" }}>
            {[
              { value: reel1, locked: locked1, shake: shake1 },
              { value: reel2, locked: locked2, shake: shake2 },
            ].map((reel, i) => (
              <div key={i} style={{
                background: "linear-gradient(180deg, #2a0a0a 0%, #1a0505 50%, #2a0a0a 100%)",
                border: `3px solid ${reel.locked ? "#c8972a" : "#6b1a1a"}`,
                borderRadius: 8,
                width: "clamp(120px,30vw,170px)",
                height: 90,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                position: "relative",
                overflow: "hidden",
                boxShadow: "none",
                transition: "border-color 0.3s",
                transform: reel.shake ? "translateY(-4px)" : "translateY(0)",
              }}>
                <div style={{ position: "absolute", inset: 0, background: "repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.08) 3px,rgba(0,0,0,0.08) 4px)", pointerEvents: "none", zIndex: 2 }} />
                <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg,rgba(26,5,5,0.8) 0%,transparent 30%,transparent 70%,rgba(26,5,5,0.8) 100%)", zIndex: 3, pointerEvents: "none" }} />
                <span style={{ fontSize: "clamp(18px,5vw,26px)", fontWeight: "bold", color: reel.locked ? "#f5d87a" : (spinning ? "#ff8a80" : "#888"), letterSpacing: "0.02em", zIndex: 4, transition: "color 0.3s" }}>
                  {reel.value}
                </span>
              </div>
            ))}
          </div>

          <button onClick={spin} disabled={spinning} style={{
            background: spinning ? "linear-gradient(135deg,#5a1010,#3a0a0a)" : "linear-gradient(135deg,#c41e1e,#8b0000)",
            border: "2px solid #c8972a",
            borderRadius: 6,
            color: spinning ? "#888" : "#f5d87a",
            fontSize: 18,
            fontFamily: "Georgia, serif",
            fontWeight: "bold",
            letterSpacing: "0.15em",
            padding: "14px 48px",
            cursor: spinning ? "not-allowed" : "pointer",
            textTransform: "uppercase",
            boxShadow: "none",
            transition: "all 0.2s",
            marginBottom: 40,
          }}>
            {spinning ? "Rolling..." : "Roll"}
          </button>

          <div style={{ minHeight: 100, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            {revealed && finalName && (
              <div style={{ textAlign: "center", animation: "fadeUp 0.5s ease-out" }}>
                <div style={{ background: "linear-gradient(135deg,#2a0a0a,#1a0505)", border: "2px solid #c8972a", borderRadius: 8, padding: "18px 36px" }}>
                  <div style={{ fontSize: "clamp(26px,7vw,44px)", fontWeight: "bold", color: "#f5d87a", letterSpacing: "0.06em" }}>
                    {finalName}
                  </div>
                </div>
              </div>
            )}
          </div>

          <style>{`
            @keyframes fadeUp {
              from { opacity: 0; transform: translateY(16px); }
              to   { opacity: 1; transform: translateY(0); }
            }
          `}</style>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
